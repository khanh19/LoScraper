name: Scraper CI

on:
  pull_request:
  push:
    branches: [main, develop, 'stephen-*']
  workflow_dispatch:
    inputs:
      public_tiktok_audit:
        description: Check reviewed organizers through the public TikTok endpoints
        type: boolean
        default: false
      public_share_publisher_url:
        description: Check TikTok share links on a public publisher page in the manual audit
        type: string
        default: ''
      public_tiktok_video_url:
        description: Check the metadata of one original public TikTok video
        type: string
        default: ''
      staging_collection:
        description: Rehearse website collection or check the isolated staging target
        type: choice
        options: [none, full, refresh, check-staging]
        default: none
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'checks' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  unit:
    name: Offline scraper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/ci_tests.py

  staging_collection:
    name: Isolated staging collection
    if: github.event_name == 'workflow_dispatch' && inputs.staging_collection != 'none'
    needs: unit
    uses: ./.github/workflows/trending.yml
    with:
      mode: ${{ inputs.staging_collection }}
      city: all
      pilot: false
    secrets:
      TRENDING_STAGING_DATABASE_URL: ${{ secrets.TRENDING_STAGING_DATABASE_URL }}
      TRENDING_STAGING_DATABASE_ROOT_CA: ${{ secrets.TRENDING_STAGING_DATABASE_ROOT_CA }}

  public_tiktok:
    name: Review public TikTok metadata
    if: github.event_name == 'workflow_dispatch' && (inputs.public_tiktok_audit || inputs.public_tiktok_video_url != '')
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
        if: inputs.public_share_publisher_url == '' && inputs.public_tiktok_video_url == ''
      - run: python -m trending.tiktok_public --browser
        if: inputs.public_share_publisher_url == '' && inputs.public_tiktok_video_url == ''
      - name: Check an original public TikTok video
        if: inputs.public_tiktok_video_url != ''
        env:
          VIDEO_URL: ${{ inputs.public_tiktok_video_url }}
        run: python -m trending.tiktok_public --url "$VIDEO_URL"
      - name: Check original post links without fetching post media
        if: inputs.public_share_publisher_url != '' && inputs.public_tiktok_video_url == ''
        env:
          PUBLISHER_PAGE: ${{ inputs.public_share_publisher_url }}
        run: |
          set -o pipefail
          python -m trending.social_links --url "$PUBLISHER_PAGE" | jq 'del(.pages[].posts[]?.text)'
