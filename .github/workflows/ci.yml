name: Scraper CI

on:
  pull_request:
  push:
    branches: [main, develop, 'stephen-*']
  workflow_dispatch:
    inputs:
      public_tiktok_audit:
        description: Check reviewed organizers through the public TikTok endpoints
        type: boolean
        default: false
      staging_collection:
        description: Manually rehearse website collection against isolated staging
        type: choice
        options: [none, full, refresh]
        default: none
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'checks' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  unit:
    name: Offline scraper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/ci_tests.py

  staging_collection:
    name: Isolated staging collection
    if: github.event_name == 'workflow_dispatch' && (inputs.staging_collection == 'full' || inputs.staging_collection == 'refresh')
    needs: unit
    uses: ./.github/workflows/trending.yml
    with:
      mode: ${{ inputs.staging_collection }}
      city: all
      pilot: false
    secrets:
      TRENDING_STAGING_DATABASE_URL: ${{ secrets.TRENDING_STAGING_DATABASE_URL }}
      TRENDING_STAGING_DATABASE_ROOT_CA: ${{ secrets.TRENDING_STAGING_DATABASE_ROOT_CA }}

  public_tiktok:
    name: Review public TikTok metadata
    if: github.event_name == 'workflow_dispatch' && inputs.public_tiktok_audit
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m trending.tiktok_public --browser
