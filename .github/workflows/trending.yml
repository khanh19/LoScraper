name: Collect verified local discovery

on:
  schedule:
    # 23:00 UTC is 06:00 the following day in Vietnam (no DST).
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Full discovery or existing website checks only
        type: choice
        options: [full, refresh]
        default: full
      city:
        description: City (all collects all three)
        type: choice
        options: [all, hcmc, hanoi, danang]
        default: all
      pilot:
        description: Audit adapters without importing
        type: boolean
        default: true
      providers:
        description: Include optional providers with verified free allowance
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: lo-discovery-ingestion
  cancel-in-progress: false

jobs:
  policy:
    if: github.event_name == 'workflow_dispatch' || vars.TRENDING_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mode=${MANUAL_MODE:-full}" >> "$GITHUB_OUTPUT"
          else
            python -m trending.schedule >> "$GITHUB_OUTPUT"
          fi
  collect:
    needs: policy
    if: needs.policy.outputs.mode != 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - name: Collect and validate
        env:
          DATABASE_URL: ${{ github.event_name == 'schedule' && secrets.TRENDING_DATABASE_URL || secrets.DATABASE_URL }}
          SCHEDULE_DATABASE_URL: ${{ secrets.TRENDING_DATABASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ needs.policy.outputs.mode }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_BILLING_API_KEY: ${{ secrets.BRIGHTDATA_BILLING_API_KEY }}
          BRIGHTDATA_FREE_VERIFICATION_JSON: ${{ secrets.BRIGHTDATA_FREE_VERIFICATION_JSON }}
          INPUT_CITY: ${{ inputs.city }}
          INPUT_PILOT: ${{ inputs.pilot }}
          INPUT_PROVIDERS: ${{ inputs.providers }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Never fall back to the legacy/shared database for automated writes.
            export DATABASE_URL="$SCHEDULE_DATABASE_URL"
          fi
          if [ "$INPUT_PILOT" != "true" ] && [ -z "$DATABASE_URL" ]; then
            echo "Missing collection database configuration" >&2
            exit 1
          fi
          if [ "$MODE" = "refresh" ]; then
            if [ "$INPUT_PILOT" = "true" ]; then
              echo "Existing-item checks require pilot=false" >&2
              exit 1
            fi
            args=(--browser --write-db --refresh-existing)
            if [ -n "$INPUT_CITY" ] && [ "$INPUT_CITY" != "all" ]; then args+=(--city "$INPUT_CITY"); fi
            python -m trending "${args[@]}"
          else
            # Full updates also recheck existing entries, so verification runs daily.
            refresh_status=0
            if [ "$INPUT_PILOT" != "true" ]; then
              refresh_args=(--browser --write-db --refresh-existing)
              if [ -n "$INPUT_CITY" ] && [ "$INPUT_CITY" != "all" ]; then refresh_args+=(--city "$INPUT_CITY"); fi
              python -m trending "${refresh_args[@]}" || refresh_status=$?
            fi
            args=(--browser --supplemental --limit 20)
            if [ -n "$INPUT_CITY" ] && [ "$INPUT_CITY" != "all" ]; then args+=(--city "$INPUT_CITY"); fi
            if [ "$INPUT_PILOT" = "true" ]; then args+=(--pilot); else args+=(--write-db); fi
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PROVIDERS" = "true" ]; then args+=(--providers); fi
            discovery_status=0
            python -m trending "${args[@]}" || discovery_status=$?
            if [ "$discovery_status" -ne 0 ]; then exit "$discovery_status"; fi
            exit "$refresh_status"
          fi
      # No raw scrape artifacts or media uploads; receipts live in Postgres.
