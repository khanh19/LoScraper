name: Collect verified local discovery

on:
  schedule:
    # Monday and Thursday UTC map to Tuesday and Friday in Vietnam.
    - cron: '0 23 * * 1,4'
    - cron: '0 23 * * 0,2,3,5,6'
  workflow_dispatch:
    inputs:
      mode:
        description: Collect website evidence or inspect a database target read-only
        type: choice
        options: [full, refresh, check-staging, check-scheduled]
        default: full
      city:
        description: City (all collects all three)
        type: choice
        options: [all, hcmc, hanoi, danang]
        default: all
      pilot:
        description: Audit adapters without importing
        type: boolean
        default: true
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      city:
        type: string
        default: all
      pilot:
        type: boolean
        default: true
    secrets:
      TRENDING_STAGING_DATABASE_URL:
        required: false
      TRENDING_STAGING_DATABASE_ROOT_CA:
        required: false
      TRENDING_DATABASE_URL:
        required: false
      TRENDING_DATABASE_ROOT_CA:
        required: false

permissions:
  contents: read
concurrency:
  group: lo-discovery-ingestion
  cancel-in-progress: false

jobs:
  policy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.TRENDING_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.event_name == 'schedule' && github.token || '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$MANUAL_MODE" in
              full|refresh|check-staging|check-scheduled) echo "mode=$MANUAL_MODE" >> "$GITHUB_OUTPUT" ;;
              *) echo "Invalid manual collection mode" >&2; exit 1 ;;
            esac
          else
            triggered_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
            python -m trending.schedule --cron "$EVENT_CRON" --triggered-at "$triggered_at" >> "$GITHUB_OUTPUT"
          fi
      - name: Record scheduled slot
        if: github.event_name == 'schedule'
        env:
          DUE: ${{ steps.policy.outputs.due }}
          MODE: ${{ steps.policy.outputs.mode }}
        run: printf 'Scheduled slot %s\n\nCollection mode %s\n' "$DUE" "$MODE" >> "$GITHUB_STEP_SUMMARY"
  collect:
    needs: policy
    if: needs.policy.outputs.mode != 'disabled'
    runs-on: ubuntu-latest
    # Full runs include a recheck before discovering new events.
    timeout-minutes: ${{ needs.policy.outputs.mode == 'full' && 90 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
        if: needs.policy.outputs.mode == 'full' || needs.policy.outputs.mode == 'refresh'
      - name: Collect and validate
        env:
          STAGING_DATABASE_URL: ${{ secrets.TRENDING_STAGING_DATABASE_URL }}
          STAGING_DATABASE_ROOT_CA: ${{ secrets.TRENDING_STAGING_DATABASE_ROOT_CA }}
          SCHEDULE_DATABASE_URL: ${{ secrets.TRENDING_DATABASE_URL }}
          SCHEDULE_DATABASE_ROOT_CA: ${{ secrets.TRENDING_DATABASE_ROOT_CA }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ needs.policy.outputs.mode }}
          INPUT_CITY: ${{ inputs.city }}
          INPUT_PILOT: ${{ inputs.pilot }}
        run: |
          set -o pipefail
          database_root_ca=
          if [ "$EVENT_NAME" = "schedule" ] || [ "$MODE" = "check-scheduled" ]; then
            export DATABASE_URL="$SCHEDULE_DATABASE_URL"
            database_root_ca="$SCHEDULE_DATABASE_ROOT_CA"
          elif [ "$INPUT_PILOT" = "true" ] && [ "$MODE" != "check-staging" ]; then
            unset DATABASE_URL
          else
            export DATABASE_URL="$STAGING_DATABASE_URL"
            database_root_ca="$STAGING_DATABASE_ROOT_CA"
          fi
          if [ -n "$database_root_ca" ]; then
            database_ca_path=$(mktemp)
            trap 'rm -f "$database_ca_path"' EXIT
            printf '%s\n' "$database_root_ca" > "$database_ca_path"
            export PGSSLROOTCERT="$database_ca_path"
          fi
          case "$MODE" in
            check-staging|check-scheduled)
              python -m trending.coverage --require-verified-tls --check-collector-writes | tee -a "$GITHUB_STEP_SUMMARY"
              exit $?
              ;;
          esac
          if [ "$EVENT_NAME" = "schedule" ]; then
            if ! preflight=$(python -m trending.coverage --require-verified-tls --check-collector-writes); then
              printf '%s\n' "$preflight" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          elif [ "$INPUT_PILOT" != "true" ] && [ -z "$DATABASE_URL" ]; then
            echo "Missing collection database configuration" >&2
            exit 1
          fi
          collection_status=0
          if [ "$MODE" = "refresh" ]; then
            if [ "$INPUT_PILOT" = "true" ]; then
              echo "Existing-item checks require pilot=false" >&2
              exit 1
            fi
            args=(--browser --write-db --refresh-existing)
            if [ -n "$INPUT_CITY" ] && [ "$INPUT_CITY" != "all" ]; then args+=(--city "$INPUT_CITY"); fi
            python -m trending "${args[@]}" || collection_status=$?
          else
            # Full updates also recheck existing entries, so verification runs daily.
            refresh_status=0
            if [ "$INPUT_PILOT" != "true" ]; then
              refresh_args=(--browser --write-db --refresh-existing)
              if [ -n "$INPUT_CITY" ] && [ "$INPUT_CITY" != "all" ]; then refresh_args+=(--city "$INPUT_CITY"); fi
              python -m trending "${refresh_args[@]}" || refresh_status=$?
            fi
            args=(--browser --supplemental --limit 20)
            if [ -n "$INPUT_CITY" ] && [ "$INPUT_CITY" != "all" ]; then args+=(--city "$INPUT_CITY"); fi
            if [ "$INPUT_PILOT" = "true" ]; then args+=(--pilot); else args+=(--write-db); fi
            python -m trending "${args[@]}" || collection_status=$?
            if [ "$collection_status" -eq 0 ]; then collection_status="$refresh_status"; fi
          fi
          coverage_status=0
          if [ "$INPUT_PILOT" != "true" ]; then
            python -m trending.coverage >> "$GITHUB_STEP_SUMMARY" || coverage_status=$?
          fi
          if [ "$collection_status" -ne 0 ]; then exit "$collection_status"; fi
          exit "$coverage_status"
      # No raw scrape artifacts or media uploads; receipts live in Postgres.
